; Producer-consumer demo for the ESP32-C6-WROOM-1 module.
; The matching pioarduino board is the ESP32-C6-DevKitC-1, which carries that module.
; Open this folder in VS Code with the pioarduino IDE extension.

[platformio]
src_dir = main
default_envs = esp32-c6-devkitc-1
description = Producer-consumer demo for ESP32-C6-WROOM-1

[env:esp32-c6-devkitc-1]
;platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
platform = espressif32 @ 6.6.0
framework = espidf
board = esp32-c6-devkitc-1
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
; On-board USB-JTAG on the ESP32-C6-DevKitC-1. Close the serial monitor
; before starting a session; it uses the same USB port as the debugger.
build_type = debug
debug_tool = esp-builtin
debug_init_break = thb app_main
debug_speed = 5000
test_framework = unity
build_flags =
    -Icomponents/event_queue/include
    -Icomponents/fsm/include
    -Icomponents/led_driver/include
